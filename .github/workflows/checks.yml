name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: deterministic JSON manifest scan
        run: >-
          python -c "import json; import re; from pathlib import Path; files = (Path('.codex-plugin/plugin.json'), Path('.claude-plugin/plugin.json'), Path('.claude-plugin/marketplace.json')); manifests = [json.loads(path.read_text(encoding='utf-8')) for path in files]; version = manifests[1].get('version'); assert isinstance(version, str) and re.fullmatch(r'\d+\.\d+\.\d+', version); assert all(manifest.get('version') == version for manifest in manifests[:2]); assert all(key not in manifest for manifest in manifests[:2] for key in ('hooks', 'mcpServers')); dependency = json.loads(Path('registry/dependencies.json').read_text(encoding='utf-8')); assert dependency['schema_version'] == 1 and len(dependency['dependencies']) == 1; entry = dependency['dependencies'][0]; assert entry['id'] == 'donsetch' and entry['tested_version'] == '3.4.4' and entry['license'] == 'AGPL-3.0-only' and len(entry['platforms']) == 5; assert all(re.fullmatch(r'[0-9a-f]{64}', item['sha256']) for item in entry['platforms'])"

      # The catalog builder reads YAML registries; its tests exercise that path.
      - name: install test dependency
        run: python -m pip install --quiet pyyaml

      - name: unit tests
        run: python -m unittest discover -s tests -v

      - name: catalog producer contract
        run: >-
          python -c "import json, sys, tempfile; sys.path.insert(0, '.'); from pathlib import Path; from scripts.build_catalog import _record, validate; record = _record({'full_name': 'owner/repo', 'stargazers_count': 12, 'pushed_at': '2026-08-20T00:00:00Z', 'license': {'spdx_id': 'MIT'}, 'topics': ['mcp']}, 'mcp-server', 'ci', 'mcp-servers', '2026-09-01T00:00:00Z'); path = Path(tempfile.mkdtemp()) / 'catalog.jsonl'; path.write_text(json.dumps(record) + '\n', encoding='utf-8'); assert validate(path) == 1"

      - name: compile Python sources
        run: python -m compileall -q scripts tests

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shell syntax
        run: sh -n hooks/session-start.sh
