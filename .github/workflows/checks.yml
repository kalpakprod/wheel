name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deterministic JSON manifest scan
        run: >-
          python -c "import json; import re; from pathlib import Path; files = (Path('.codex-plugin/plugin.json'), Path('.claude-plugin/plugin.json'), Path('.claude-plugin/marketplace.json')); manifests = [json.loads(path.read_text(encoding='utf-8')) for path in files]; assert all(manifest.get('version') == '0.6.0' for manifest in manifests[:2]); assert all(key not in manifest for manifest in manifests[:2] for key in ('hooks', 'mcpServers')); dependency = json.loads(Path('registry/dependencies.json').read_text(encoding='utf-8')); assert dependency['schema_version'] == 1 and len(dependency['dependencies']) == 1; entry = dependency['dependencies'][0]; assert entry['id'] == 'donsetch' and entry['tested_version'] == '3.4.4' and entry['license'] == 'AGPL-3.0-only' and len(entry['platforms']) == 5; assert all(re.fullmatch(r'[0-9a-f]{64}', item['sha256']) for item in entry['platforms'])"

      - name: unit tests
        run: python -m unittest discover -s tests -v

      - name: compile Python sources
        run: python -m compileall -q scripts tests

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax
        run: sh -n hooks/session-start.sh
