name: sync-catalog

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: install build dependency
        run: python -m pip install --quiet pyyaml

      - name: fetch previous catalog
        run: |
          set -euo pipefail
          mkdir -p dist
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git show FETCH_HEAD:catalog.jsonl > dist/previous.jsonl || rm -f dist/previous.jsonl
          fi
          if [ -f dist/previous.jsonl ]; then wc -l dist/previous.jsonl; else echo "no previous catalog"; fi

      # Measured on 2026-09-04 with the shipped registry: 264 API requests and
      # about 200 s per run. GITHUB_TOKEN is capped at 1000 requests per hour per
      # repository, so raising awesome_repos_per_list costs 1 request per added
      # repository per list and the margin is roughly 3.8x, not unlimited.
      - name: build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f dist/previous.jsonl ]; then
            python scripts/build_catalog.py --out dist/catalog.jsonl --meta dist/catalog.meta.json --previous dist/previous.jsonl
          else
            python scripts/build_catalog.py --out dist/catalog.jsonl --meta dist/catalog.meta.json
          fi

      - name: validate catalog with the consumer parser
        run: python scripts/build_catalog.py --validate dist/catalog.jsonl

      # Optional second origin. Skipped entirely unless all three values are set,
      # because a half-configured repository must not fail the nightly job. The
      # upload goes through the Cloudflare API rather than wrangler so the step
      # needs no Node toolchain and no npx download on every run.
      - name: publish to cloudflare kv
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_KV_NAMESPACE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: python scripts/publish_edge.py --catalog dist/catalog.jsonl --meta dist/catalog.meta.json

      - name: publish to data branch
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp dist/catalog.jsonl dist/catalog.meta.json "$staging/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
          fi
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp "$staging/catalog.jsonl" "$staging/catalog.meta.json" .
          printf 'Generated by .github/workflows/sync-catalog.yml. Do not edit by hand.\n' > README.md
          git add catalog.jsonl catalog.meta.json README.md
          if git diff --cached --quiet; then
            echo "catalog unchanged"
            exit 0
          fi
          git commit -m "chore(catalog): daily sync"
          git push origin data
