# wheel: intent -> available host skills and live-market search routes.
#
# Deterministic layer. The skill greps `triggers` against the user's request,
# takes `skills` (switch on when available) and `search_terms` / `topics`
# (feed into live research). Nothing here is a recommendation of a product —
# maturity and gaps are measured per candidate at runtime.
#
# Adding an entry: only when an existing one does not cover the intent.
# Keep `skills` to what actually exists and is installable.

