<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="wheel-state-title wheel-state-desc">
      <title id="wheel-state-title">Wheel run state machine</title>
      <desc id="wheel-state-desc">Seven states move one software request from context and live research through a verified decision to an accepted durable record.</desc>
      <defs>
        <marker id="wheel-state-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="wheel-state-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="wheel-state-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <text x="40" y="64" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="2">RUN STATE MACHINE</text>
      <text x="40" y="112" fill="#2d3142" font-size="40" font-family="'Instrument Serif', Georgia, serif">Evidence before implementation</text>
      <text x="40" y="148" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, sans-serif">Every transition preserves what was learned. Only an accepted verdict becomes durable.</text>

      <!-- Transitions are drawn before states. -->
      <line x1="40" y1="360" x2="60" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wheel-state-arrow)"/>
      <line x1="188" y1="360" x2="232" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wheel-state-arrow)"/>
      <line x1="360" y1="360" x2="404" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wheel-state-arrow)"/>
      <line x1="532" y1="360" x2="576" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wheel-state-arrow)"/>
      <line x1="704" y1="360" x2="748" y2="360" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#wheel-state-arrow-accent)"/>
      <line x1="876" y1="360" x2="920" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#wheel-state-arrow)"/>
      <line x1="1048" y1="360" x2="1092" y2="360" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#wheel-state-arrow-link)"/>
      <line x1="1220" y1="360" x2="1244" y2="360" stroke="#2d3142" stroke-width="1.2"/>

      <!-- Transition labels with visible connector gaps. -->
      <g fill="#f5f5f5">
        <rect x="192" y="328" width="36" height="16" rx="2"/>
        <rect x="364" y="328" width="36" height="16" rx="2"/>
        <rect x="536" y="328" width="36" height="16" rx="2"/>
        <rect x="708" y="328" width="36" height="16" rx="2"/>
        <rect x="880" y="328" width="36" height="16" rx="2"/>
        <rect x="1052" y="328" width="36" height="16" rx="2"/>
      </g>
      <g fill="#7a8399" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.4">
        <text x="210" y="340">NEXT</text>
        <text x="382" y="340">ASK</text>
        <text x="554" y="340">NARROW</text>
        <text x="726" y="340">CHECK</text>
        <text x="898" y="340">COMPARE</text>
        <text x="1070" y="340">ACCEPT</text>
      </g>

      <circle cx="32" cy="360" r="6" fill="#2d3142"/>

      <!-- States -->
      <g>
        <rect x="60" y="312" width="128" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="124" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">context</text>
        <text x="124" y="380" fill="#4f5d75" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">inputs</text>
      </g>
      <g>
        <rect x="232" y="312" width="128" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="296" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">quick</text>
        <text x="296" y="380" fill="#4f5d75" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">families</text>
      </g>
      <g>
        <rect x="404" y="312" width="128" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="468" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">question</text>
        <text x="468" y="380" fill="#4f5d75" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one choice</text>
      </g>
      <g>
        <rect x="576" y="312" width="128" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="640" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">deep</text>
        <text x="640" y="380" fill="#4f5d75" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4–8 candidates</text>
      </g>
      <g>
        <rect x="748" y="312" width="128" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="812" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">verify</text>
        <text x="812" y="380" fill="#eb6c36" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">core gate</text>
      </g>
      <g>
        <rect x="920" y="312" width="128" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="984" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">decision</text>
        <text x="984" y="380" fill="#4f5d75" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">adoption mode</text>
      </g>
      <g>
        <rect x="1092" y="312" width="128" height="96" rx="8" fill="rgba(45,49,66,0.05)" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="1156" y="352" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">recorded</text>
        <text x="1156" y="380" fill="#2e5aa8" font-size="16" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">accepted only</text>
      </g>

      <circle cx="1252" cy="360" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="1252" cy="360" r="5" fill="#2d3142"/>

      <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="2">LEGEND</text>
      <circle cx="160" cy="672" r="5" fill="#eb6c36"/>
      <text x="176" y="676" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, sans-serif">mandatory verification gate</text>
      <circle cx="424" cy="672" r="5" fill="#2e5aa8"/>
      <text x="440" y="676" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, sans-serif">durable only after acceptance</text>
      <text x="1240" y="676" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="1">WHEEL 0.6.0</text>
    </svg>
